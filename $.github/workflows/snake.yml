
name: Generate Purple Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Purple Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: PriyanshiGupta112
          outputs: |
            dist/github-snake.svg?color_snake=%23A855F7&color_dots=%23EDE9FE,%23DDD6FE,%23C4B5FD,%23A78BFA,%238B5CF6

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
