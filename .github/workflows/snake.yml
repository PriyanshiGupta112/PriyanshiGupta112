name: Generate Animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          
         outputs: |
          dist/github-snake.svg?color_snake=%23A855F7&color_dots=%23EDE9FE,%23DDD6FE,%23C4B5FD,%23A78BFA,%238B5CF6
          dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C084FC&color_dots=%232E1065,%235B21B6,%237C3AED,%23A855F7,%23D8B4FE


      - name: Push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
